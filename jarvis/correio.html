<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="theme-color" content="#0b0c0f">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>JARVIS · Correio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fragment+Mono&family=Montserrat:wght@400;500;600;700;800&family=Vollkorn:ital,wght@0,400;1,400&display=swap" rel="stylesheet">
<style>
/* Correio do Jarvis: o que ele te entrega (arquivos que criou ou editou) e o que você mandou para ele.
   Mesmo visual do app (fundo grafite, âmbar, Montserrat/Fragment Mono/Vollkorn) com o azul e o amarelo do carteiro. */
:root{
  --bg:#0b0c0f;--bg2:#14161a;--bg3:#1b1e23;--line:#262931;--text:#f1efe9;--mute:#a3a09a;--acc:#f2b33d;--acc-s:color-mix(in oklab,#f2b33d 38%,transparent);
  --post:#3a62d0;--post2:#2a4aa8;--err:#ef6b6b;--ease:cubic-bezier(.2,.8,.2,1);
  --mono:'Fragment Mono',ui-monospace,Menlo,monospace;--serif:'Vollkorn',Georgia,serif;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--text);font:400 15px/1.5 'Montserrat',system-ui,sans-serif;-webkit-font-smoothing:antialiased;overflow:hidden}
button{font:inherit;color:inherit}
.app{height:100dvh;display:grid;grid-template-rows:auto auto minmax(0,1fr)}

/* Topo */
header{display:flex;align-items:flex-end;gap:18px;padding:22px 28px 14px}
.kick{margin:0;font:400 12px var(--mono);letter-spacing:.28em;color:var(--mute)}
.kick b{color:var(--acc);font-weight:400}
h1{margin:4px 0 0;font-weight:800;font-size:30px;letter-spacing:-.02em;line-height:1.05}
.sub{margin:4px 0 0;font:italic 400 16px var(--serif);color:var(--mute)}
.tabs{margin-left:auto;display:inline-flex;padding:3px;border:1px solid var(--line);border-radius:999px;background:#0e0f12}
.tabs button{border:0;background:none;padding:6px 14px;border-radius:999px;font:600 11px var(--mono);letter-spacing:.08em;text-transform:uppercase;color:#7d7a74;cursor:pointer;transition:background .2s,color .2s}
.tabs button[aria-pressed=true]{background:var(--acc);color:#16120a}
.tabs button:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.tabs .n{opacity:.7;margin-left:6px}

/* Cena: a calçada com a caixa de correio, onde o Jarvis Code de carteiro chega */
.scene{position:relative;height:118px;margin:0 28px;border-bottom:1px solid var(--line);overflow:hidden;
  background:radial-gradient(60% 120% at 88% 110%,color-mix(in oklab,var(--post) 22%,transparent),transparent 70%)}
.scene::after{content:'';position:absolute;left:0;right:0;bottom:0;height:10px;background:repeating-linear-gradient(90deg,#1b1d22 0 22px,#16171b 22px 26px)}
.box{position:absolute;right:46px;bottom:10px;width:74px;height:96px}
.box .post{position:absolute;left:31px;bottom:0;width:12px;height:42px;background:linear-gradient(90deg,#2a2c33,#3a3d46 50%,#2a2c33)}
.box .body{position:absolute;left:0;bottom:40px;width:74px;height:54px;border-radius:26px 26px 6px 6px;background:linear-gradient(#4a72e0,var(--post) 55%,var(--post2));box-shadow:inset 0 -6px 0 #1f3b8c,0 8px 20px -8px #000}
.box .body::before{content:'';position:absolute;left:12px;right:12px;top:16px;height:5px;border-radius:3px;background:#0b1a44;box-shadow:0 0 0 2px #2b4cb0}
.box .body::after{content:'CORREIO';position:absolute;left:0;right:0;bottom:9px;text-align:center;font:700 8px var(--mono);letter-spacing:.2em;color:#ffd77a}
.box .flag{position:absolute;right:-6px;bottom:58px;width:6px;height:30px;background:#c7c2b8;transform-origin:bottom center;transform:rotate(90deg);transition:transform .5s var(--ease)}
.box .flag::after{content:'';position:absolute;left:0;top:0;width:16px;height:11px;background:var(--err);border-radius:2px}
.box.up .flag{transform:rotate(0)}
.box.bump .body{animation:bump .5s var(--ease)}
@keyframes bump{30%{transform:translateY(-3px) scale(1.03)}}
#jc{position:absolute;bottom:8px;left:-140px;width:128px;height:122px;image-rendering:pixelated;pointer-events:none}
#jc.flip{transform:scaleX(-1)}
.letter{position:absolute;width:22px;height:15px;border-radius:2px;background:#f4efe2;box-shadow:0 2px 6px #0008;opacity:0;pointer-events:none}
.letter::before{content:'';position:absolute;inset:0;background:linear-gradient(160deg,transparent 48%,#d8cfb8 50%,transparent 52%),linear-gradient(20deg,transparent 48%,#d8cfb8 50%,transparent 52%)}
.hint{position:absolute;left:0;bottom:22px;font:400 12px var(--mono);color:var(--mute);opacity:.8}

/* Cartas */
main{overflow:auto;padding:18px 28px 28px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:16px}
.env{position:relative;border-radius:14px;background:linear-gradient(#191b20,#15171b);border:1px solid var(--line);padding:16px 16px 14px;min-height:150px;
  display:flex;flex-direction:column;gap:6px;overflow:hidden;transition:border-color .25s,transform .25s var(--ease),box-shadow .25s;animation:envIn .5s var(--ease) both}
@keyframes envIn{from{opacity:0;transform:translateY(10px)}}
.env:hover{border-color:#3a3e48;transform:translateY(-2px);box-shadow:0 14px 30px -18px #000}
/* aba do envelope */
.env::before{content:'';position:absolute;left:0;right:0;top:0;height:46px;background:linear-gradient(170deg,transparent 49.5%,#ffffff07 50%) left/50% 100% no-repeat,linear-gradient(190deg,transparent 49.5%,#ffffff07 50%) right/50% 100% no-repeat;pointer-events:none}
.env.novo{border-color:color-mix(in oklab,var(--acc) 55%,var(--line));box-shadow:0 0 0 1px color-mix(in oklab,var(--acc) 25%,transparent),0 18px 40px -24px color-mix(in oklab,var(--acc) 60%,transparent)}
.env.chegou{animation:chegou .9s var(--ease) both}
@keyframes chegou{0%{opacity:0;transform:translateY(-26px) rotate(-4deg) scale(.92)}60%{transform:translateY(3px) rotate(.6deg)}100%{opacity:1}}
.top{display:flex;align-items:flex-start;gap:12px}
.stamp{flex:none;width:46px;height:54px;border-radius:4px;display:grid;place-items:center;position:relative;
  background:linear-gradient(160deg,color-mix(in oklab,var(--c,#2a4aa8) 80%,#fff),var(--c,#2a4aa8));
  border:3px solid #f4efe2;outline:2px dotted #f4efe2;outline-offset:1px;box-shadow:0 6px 14px -6px #000;transform:rotate(-3deg)}
.stamp svg{width:22px;height:22px;fill:none;stroke:#fff;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.stamp i{position:absolute;bottom:3px;font:700 8px var(--mono);font-style:normal;color:#ffffffcc;letter-spacing:.05em}
.meta{min-width:0;flex:1;padding-right:52px}
.env.novo .meta{padding-right:66px}
.nm{margin:0;font-weight:700;font-size:15px;line-height:1.25;word-break:break-word}
.from{margin:2px 0 0;font:400 12px var(--mono);color:var(--mute)}
.from b{font-weight:400;color:var(--text)}
.note{margin:2px 0 0;font:italic 400 14px var(--serif);color:var(--mute)}
.pm{position:absolute;right:16px;bottom:50px;width:54px;height:54px;border-radius:50%;border:1.5px dashed #ffffff22;display:grid;place-items:center;text-align:center;
  font:400 9px/1.2 var(--mono);color:#ffffff40;transform:rotate(-12deg);pointer-events:none}
.nova{position:absolute;right:12px;top:16px;font:700 10px var(--mono);letter-spacing:.18em;color:#16120a;background:var(--acc);padding:3px 8px;border-radius:4px;transform:rotate(8deg);box-shadow:0 4px 12px -4px var(--acc)}
.acts{margin-top:auto;display:flex;gap:6px;flex-wrap:wrap;padding-top:8px}
.btn{display:inline-flex;align-items:center;gap:6px;height:30px;padding:0 12px;border-radius:999px;border:1px solid var(--line);background:var(--bg2);cursor:pointer;font:600 12px 'Montserrat',sans-serif;color:var(--text);text-decoration:none;transition:border-color .2s,background .2s,transform .15s}
.btn:hover{border-color:var(--mute)} .btn:active{transform:scale(.96)}
.btn.pri{background:var(--acc);border-color:var(--acc);color:#16120a}
.btn.x{width:30px;padding:0;justify-content:center;margin-left:auto;color:var(--mute)}
.btn.x:hover{color:var(--err);border-color:var(--err)}
.btn svg{width:14px;height:14px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.btn:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.empty{display:grid;place-items:center;text-align:center;gap:8px;padding:60px 20px;color:var(--mute)}
.empty b{display:block;font-weight:800;font-size:20px;color:var(--text)}
.empty p{margin:0;font:italic 400 16px var(--serif);max-width:42ch}
#toast{position:fixed;left:50%;bottom:18px;transform:translateX(-50%) translateY(20px);opacity:0;background:var(--bg3);border:1px solid var(--line);border-radius:999px;padding:8px 16px;font-size:13px;transition:all .3s var(--ease);pointer-events:none}
#toast.on{opacity:1;transform:translateX(-50%)}
@media (max-width:640px){header{flex-wrap:wrap}.tabs{margin-left:0}.box{right:16px}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="app">
  <header>
    <div>
      <p class="kick"><b aria-hidden="true">●</b> JARVIS · CORREIO</p>
      <h1>Caixa de correio</h1>
      <p class="sub" id="sub">Arquivos que o Jarvis te entrega e os que você mandou para ele.</p>
    </div>
    <div class="tabs" role="group" aria-label="Filtrar cartas">
      <button type="button" data-f="todas" aria-pressed="true">Todas<span class="n" id="nT"></span></button>
      <button type="button" data-f="jarvis" aria-pressed="false">Do Jarvis<span class="n" id="nJ"></span></button>
      <button type="button" data-f="voce" aria-pressed="false">Suas<span class="n" id="nV"></span></button>
    </div>
  </header>
  <div class="scene" aria-hidden="true">
    <span class="hint" id="hint"></span>
    <img id="jc" alt="" src="/jcc/parado_01.png">
    <div class="box" id="box"><div class="post"></div><div class="body"></div><div class="flag"></div></div>
  </div>
  <main><div class="grid" id="grid" aria-live="polite"></div></main>
</div>
<div id="toast" role="status"></div>
<script>
(()=>{
const $=s=>document.querySelector(s);
const api=(u,b,m)=>fetch(u,{method:m||(b?'POST':'GET'),headers:{'content-type':'application/json','x-jarvis':'1'},body:b?JSON.stringify(b):undefined}).then(async r=>{const j=await r.json().catch(()=>({}));if(!r.ok)throw new Error(j.error||'Falhou.');return j});
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const RM=matchMedia('(prefers-reduced-motion: reduce)').matches;
let items=[],filter='todas',known=null;
const toast=t=>{const e=$('#toast');e.textContent=t;e.classList.add('on');clearTimeout(e._t);e._t=setTimeout(()=>e.classList.remove('on'),2600)};

const ICON={pdf:'<path d="M7 3h7l4 4v14H7z"/><path d="M14 3v4h4M9.5 13h5M9.5 16.5h5"/>',image:'<rect x="4" y="5" width="16" height="14" rx="2"/><circle cx="9" cy="10" r="1.6"/><path d="m5 18 5-5 4 4 2-2 3 3"/>',
  code:'<path d="m9 8-4 4 4 4M15 8l4 4-4 4M13 6l-2 12"/>',text:'<path d="M7 3h7l4 4v14H7z"/><path d="M14 3v4h4M9.5 12h5M9.5 15h5M9.5 18h3"/>'};
const COLOR={pdf:'#c84a4a',image:'#2f8f6a',code:'#2a4aa8',text:'#7a5bc4'};
const SVG=k=>`<svg viewBox="0 0 24 24" aria-hidden="true">${k}</svg>`;
const I={down:'<path d="M12 4v11M7 10l5 5 5-5M5 20h14"/>',eye:'<path d="M2 12s3.6-6 10-6 10 6 10 6-3.6 6-10 6S2 12 2 12z"/><circle cx="12" cy="12" r="2.6"/>',
  folder:'<path d="M3 7a1 1 0 0 1 1-1h5l2 2h9a1 1 0 0 1 1 1v9a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1z"/>',x:'<path d="M6 6l12 12M18 6 6 18"/>'};
const size=n=>n<1024?n+' B':n<1048576?(n/1024).toFixed(n<10240?1:0)+' KB':(n/1048576).toFixed(1)+' MB';
const when=t=>{const d=new Date(t),now=new Date(),same=d.toDateString()===now.toDateString();
  return same?d.toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'}):d.toLocaleDateString('pt-BR',{day:'2-digit',month:'short'}).replace('.','')};
const ext=n=>(String(n).split('.').pop()||'').slice(0,4).toUpperCase();

function draw(fresh){
  const list=items.filter(x=>filter==='todas'||x.from===filter);
  $('#nT').textContent=items.length||'';$('#nJ').textContent=items.filter(x=>x.from==='jarvis').length||'';$('#nV').textContent=items.filter(x=>x.from==='voce').length||'';
  const nov=items.filter(x=>x.novo).length;
  $('#sub').textContent=items.length?(nov?`${nov} ${nov>1?'cartas novas':'carta nova'} esperando por você.`:'Tudo lido. Peça "me manda o arquivo" quando quiser algo de volta.'):'Arquivos que o Jarvis te entrega e os que você mandou para ele.';
  $('#box').classList.toggle('up',nov>0);
  if(!list.length){$('#grid').innerHTML=`<div class="empty" style="grid-column:1/-1"><div><b>${items.length?(filter==='voce'?'Você ainda não mandou nada':'Nada do Jarvis por aqui'):'Caixa vazia'}</b><p>${items.length?(filter==='voce'?'Solte um arquivo no Jarvis e ele aparece aqui. Ou volte para “Todas”.':'Peça “faz um PDF de…” e a carta chega aqui. Ou volte para “Todas”.'):'Quando o Jarvis criar um arquivo, ou você mandar um para ele, a carta chega aqui. Para receber de volta, é só pedir: “me manda o arquivo”.'}</p></div></div>`;return}
  $('#grid').innerHTML=list.map((x,i)=>`<article class="env${x.novo?' novo':''}${fresh?.has(x.id)?' chegou':''}" data-id="${x.id}" style="animation-delay:${fresh?.has(x.id)?0:Math.min(i,10)*40}ms">
    <div class="pm">${esc(when(x.at))}<br>JARVIS</div>${x.novo?'<span class="nova">NOVA</span>':''}
    <div class="top"><div class="stamp" style="--c:${COLOR[x.kind]||COLOR.text}">${SVG(ICON[x.kind]||ICON.text)}<i>${esc(ext(x.name))}</i></div>
      <div class="meta"><p class="nm">${esc(x.name)}</p><p class="from">De: <b>${x.from==='jarvis'?'Jarvis':'você'}</b> · ${size(x.size)}</p>${x.note?`<p class="note">${esc(x.note)}</p>`:''}</div></div>
    <div class="acts">
      <a class="btn pri" href="/api/correio/${x.id}/arquivo" download data-a="baixar">${SVG(I.down)}Baixar</a>
      ${/pdf|image/.test(x.kind)?`<a class="btn" href="/api/correio/${x.id}/arquivo?ver=1" target="_blank" rel="noopener" data-a="ver">${SVG(I.eye)}Ver</a>`:''}
      ${x.disco?`<button type="button" class="btn" data-a="pasta">${SVG(I.folder)}Na pasta</button>`:''}
      <button type="button" class="btn x" data-a="tirar" aria-label="Tirar ${esc(x.name)} da caixa" title="Tirar da caixa">${SVG(I.x)}</button>
    </div></article>`).join('');
}
$('#grid').addEventListener('click',async e=>{
  const b=e.target.closest('[data-a]');if(!b)return;const card=b.closest('.env'),id=card.dataset.id,a=b.dataset.a;
  if(a==='baixar'||a==='ver'){api(`/api/correio/${id}/visto`,{}).catch(()=>{});const x=items.find(i=>i.id===id);if(x){x.novo=false;setTimeout(()=>draw(),300)}return}
  e.preventDefault();
  try{
    if(a==='pasta'){await api(`/api/correio/${id}/pasta`,{});toast('Abrindo a pasta do arquivo.')}
    if(a==='tirar'){await api(`/api/correio/${id}`,null,'DELETE');items=items.filter(i=>i.id!==id);draw();toast('Carta tirada da caixa (o arquivo continua onde estava).')}
  }catch(er){toast(er.message)}
});
document.querySelectorAll('.tabs button').forEach(b=>b.addEventListener('click',()=>{filter=b.dataset.f;document.querySelectorAll('.tabs button').forEach(o=>o.setAttribute('aria-pressed',String(o===b)));draw()}));

/* ---- O carteiro: chega correndo pela calçada, põe a carta na caixa, ergue a bandeira, tira o boné e vai embora ---- */
const jc=$('#jc'),FR={andar:8,acenar:8,cumprimentar:12,parado:18};
const frames=(a,n)=>Array.from({length:n},(_,i)=>`/jcc/${a}_${String(i+1).padStart(2,'0')}.png`);
Object.keys(FR).forEach(a=>frames(a,FR[a]).forEach(u=>{const im=new Image();im.src=u}));
let busy=false,queue=[];
const wait=ms=>new Promise(r=>setTimeout(r,ms));
function play(a,ms,fps){return new Promise(res=>{const f=frames(a,FR[a]);let i=0;const t=setInterval(()=>{jc.src=f[i++%f.length]},1000/(fps||10));setTimeout(()=>{clearInterval(t);res()},ms)})}
function move(from,to,ms,a){jc.classList.toggle('flip',to<from);const st=performance.now();const f=frames(a,FR[a]);let k=0,last=0;
  return new Promise(res=>{const step=now=>{const u=Math.min(1,(now-st)/ms);jc.style.left=(from+(to-from)*u)+'px';if(now-last>90){jc.src=f[k++%f.length];last=now}if(u<1)requestAnimationFrame(step);else res()};requestAnimationFrame(step)})}
async function deliver(names){
  if(RM){draw(new Set(names));return}
  if(busy){queue.push(...names);return}busy=true;
  const W=$('.scene').clientWidth,box=$('#box'),stop=W-46-74-112;
  $('#hint').textContent='';
  await move(-140,stop,1500,'andar');
  await play('acenar',650,12);
  // a carta sai da mão dele e entra na caixa
  const L=document.createElement('div');L.className='letter';$('.scene').append(L);
  L.animate([{left:(stop+92)+'px',bottom:'64px',opacity:1,transform:'rotate(-10deg)'},{left:(W-46-52)+'px',bottom:'74px',opacity:1,transform:'rotate(0)'},{left:(W-46-52)+'px',bottom:'70px',opacity:0,transform:'scale(.6)'}],{duration:650,easing:'cubic-bezier(.2,.8,.2,1)'}).onfinish=()=>L.remove();
  await wait(520);box.classList.add('up','bump');setTimeout(()=>box.classList.remove('bump'),600);
  draw(new Set(names));
  $('#hint').textContent=names.length>1?`${names.length} cartas entregues`:'carta entregue';
  await play('cumprimentar',900,10);
  await move(stop,-140,1100,'andar');
  jc.src='/jcc/parado_01.png';busy=false;
  if(queue.length){const q=queue.splice(0);deliver(q)}
}

async function load(){
  try{
    const j=await api('/api/correio');const ids=new Set(items.map(x=>x.id));
    items=j.itens||[];
    // primeira leitura: entrega só o que veio marcado na abertura (?entregar=id); depois, toda carta nova que aparecer
    const want=new URLSearchParams(location.search).get('entregar');
    const fresh=known===null?items.filter(x=>x.id===want).map(x=>x.id):items.filter(x=>!ids.has(x.id)||(x.novo&&!known.has(x.id+':'+x.at))).map(x=>x.id);
    known=new Set(items.map(x=>x.id+':'+x.at));
    if(fresh.length)deliver(fresh);else draw();
  }catch{ $('#sub').textContent='Não consegui falar com o Jarvis. Ele está aberto?' }
}
load();setInterval(load,2500);
addEventListener('focus',load);
})();
</script>
</body>
</html>
